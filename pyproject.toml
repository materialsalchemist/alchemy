[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alchemy"
version = "0.1.0"
description = "A tool for exploring chemical space and generating chemical reaction networks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.2.1",
    "fastapi>=0.115.0",
    "graphviz>=0.21",
    "kuzu>=0.11.3",
    "lmdb>=1.7.3",
    "matplotlib>=3.10.5",
    "networkx>=3.5",
    "numba>=0.61.2",
    "numpy>=2.2.6",
    "openbabel-wheel>=3.1.1.23",
    "pandas>=2.3.2",
    "rdkit>=2025.3.5",
    "ruff>=0.15.11",
    "rxnmapper[rdkit]>=0.4.2",
    "scipy>=1.16.1",
    "tqdm>=4.67.1",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "flask>=3.1.2",
]

[project.scripts]
alchemy = "alchemy:main"

[tool.setuptools]
py-modules = ["alchemy"]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "lf"

